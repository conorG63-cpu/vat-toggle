name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: priceswitch-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and restart PriceSwitch
        env:
          DEPLOY_HOST: ${{ secrets.AWS_HOST }}
          DEPLOY_USER: ${{ secrets.AWS_SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'build' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/priceswitch/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/priceswitch
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '
