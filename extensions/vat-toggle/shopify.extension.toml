# Learn more at https://shopify.dev/docs/apps/app-extensions/theme-app-extensions

api_version = "2026-01"
uid = "d71b01d3-dccb-3d16-1c2a-cc7818e5e0932046a4f7"
type = "theme"

# Declare metafield access for reading app-owned metafields
[[metafields]]
  namespace = "$app:vat_toggle"
  key = "settings"

[[metafields]]
  namespace = "$app:vat_toggle"
  key = "exemption"

[settings]
  [[settings.fields]]
    key = "show_toggle"
    type = "boolean"
    name = "Show VAT toggle"
    default = true

  [[settings.fields]]
    key = "default_mode"
    type = "select"
    name = "Default display mode"
    default = "inclusive"
    [[settings.fields.options]]
      label = "Include VAT"
      value = "inclusive"
    [[settings.fields.options]]
      label = "Exclude VAT"
      value = "exclusive"

  [[settings.fields]]
    key = "vat_rate"
    type = "range"
    name = "VAT Rate (%)"
    min = 0
    max = 30
    step = 0.5
    default = 20
    unit = "%"

  [[settings.fields]]
    key = "inclusive_label"
    type = "text"
    name = "VAT inclusive label"
    default = "Inc. VAT"

  [[settings.fields]]
    key = "exclusive_label"
    type = "text"
    name = "VAT exclusive label"
    default = "Ex. VAT"

  [[settings.fields]]
    key = "show_popup"
    type = "boolean"
    name = "Show popup on first visit"
    default = true

  [[settings.fields]]
    key = "popup_title"
    type = "text"
    name = "Popup title"
    default = "How would you like to see prices?"

  [[settings.fields]]
    key = "popup_message"
    type = "textarea"
    name = "Popup message"
    default = "Choose your preferred pricing display"
